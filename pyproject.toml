[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "dataguard-analyzer"
version = "1.0.0"
description = "Automated Dataset Health & Machine Learning Readiness Analyzer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Mohammed Alanazi"}]
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "streamlit>=1.50,<2", "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

